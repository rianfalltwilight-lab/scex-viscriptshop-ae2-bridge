plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.116'
}

version = mod_version
group = 'cn.scex.compat'

base { archivesName = 'scex-viscriptshop-ae2-bridge-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories { mavenCentral() }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = neoforge_version
    runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'scex_viscriptshop_ae2'
        }
        server { server() }
    }
    mods { scex_viscriptshop_ae2 { sourceSet sourceSets.main } }
    mods.scex_viscriptshop_ae2.sourceSet sourceSets.gametest
}

dependencies {
    implementation files('vendor/ViScriptShop-neoforge-1.21.1-1.2.0.jar')
    implementation files('vendor/appliedenergistics2-19.2.17.jar')
    implementation files('vendor/ldlib2-neoforge-1.21.1-2.2.37-all.jar')
    runtimeOnly files('vendor/guideme-21.1.17.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest.attributes(
            'Implementation-Title': 'SCEX ViScriptShop AE2 Bridge',
            'Implementation-Version': project.version,
            'Built-For-ViScriptShop': '1.2.0',
            'Built-For-AE2': '19.2.17',
            'Built-For-NeoForge': neoforge_version)
}

tasks.register('gametestProbeJar', Jar) {
    archiveClassifier = 'gametest-probe'
    from sourceSets.gametest.output
}

tasks.named('build') { dependsOn tasks.named('gametestProbeJar') }
