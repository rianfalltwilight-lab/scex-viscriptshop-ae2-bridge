name: Publish v0.3.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.3.3.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'rianfalltwilight-lab/scex-viscriptshop-ae2-bridge'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble without tests
        run: ./gradlew clean assemble --no-build-cache

      - name: Verify release hashes
        shell: bash
        run: |
          cd build/libs
          printf '%s\n' \
            '61fec6489d083421ba231fe4b9ccfedc8e42d830adb0ce5b55457d5c69d070de *scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3.jar' \
            '60eb5eb59bc08e7a7fc849437a1c67f9987c1c986251ef6aa58e56937481d14c *scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3-sources.jar' \
            > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            'build/libs/scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3.jar#SCEX ViScriptShop AE2 Bridge 0.3.3'
            'build/libs/scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3-sources.jar#Source JAR'
            'build/libs/SHA256SUMS.txt#SHA-256 checksums'
          )
          if gh release view v0.3.3 >/dev/null 2>&1; then
            gh release edit v0.3.3 \
              --title 'SCEX ViScriptShop × AE2 Bridge 0.3.3' \
              --notes-file docs/GITHUB-RELEASE-0.3.3.md \
              --latest
            gh release upload v0.3.3 "${assets[@]}" --clobber
          else
            gh release create v0.3.3 "${assets[@]}" \
              --verify-tag \
              --title 'SCEX ViScriptShop × AE2 Bridge 0.3.3' \
              --notes-file docs/GITHUB-RELEASE-0.3.3.md \
              --latest
          fi
