name: Publish v0.3.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.3.3.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'rianfalltwilight-lab/scex-viscriptshop-ae2-bridge'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: v0.3.3
          path: release-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: release-source

      - name: Configure reproducible archive build
        shell: bash
        run: |
          printf '%s\n' \
            'allprojects {' \
            '  tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {' \
            '    preserveFileTimestamps = false' \
            '    reproducibleFileOrder = true' \
            '  }' \
            '}' \
            > "$RUNNER_TEMP/reproducible-archives.gradle"

      - name: First clean assembly without tests
        shell: bash
        working-directory: release-source
        run: |
          ./gradlew clean assemble --no-build-cache \
            --init-script "$RUNNER_TEMP/reproducible-archives.gradle"

      - name: Record first build hashes
        shell: bash
        working-directory: release-source
        run: |
          cd build/libs
          sha256sum \
            scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3.jar \
            scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3-sources.jar \
            | tee "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Rebuild and verify reproducibility
        shell: bash
        working-directory: release-source
        run: |
          ./gradlew clean assemble --no-build-cache \
            --init-script "$RUNNER_TEMP/reproducible-archives.gradle"
          cd build/libs
          sha256sum --check "$RUNNER_TEMP/SHA256SUMS.txt"
          jar --list --file scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3.jar >/dev/null
          jar --list --file scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3-sources.jar >/dev/null
          unzip -p scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3.jar META-INF/MANIFEST.MF \
            | grep -F 'Implementation-Version: 0.3.3'
          cp "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            'release-source/build/libs/scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3.jar#SCEX ViScriptShop AE2 Bridge 0.3.3'
            'release-source/build/libs/scex-viscriptshop-ae2-bridge-neoforge-1.21.1-0.3.3-sources.jar#Source JAR'
            'release-source/build/libs/SHA256SUMS.txt#SHA-256 checksums'
          )
          if gh release view v0.3.3 >/dev/null 2>&1; then
            gh release edit v0.3.3 \
              --title 'SCEX ViScriptShop × AE2 Bridge 0.3.3' \
              --notes-file docs/GITHUB-RELEASE-0.3.3.md \
              --latest
            gh release upload v0.3.3 "${assets[@]}" --clobber
          else
            gh release create v0.3.3 "${assets[@]}" \
              --verify-tag \
              --title 'SCEX ViScriptShop × AE2 Bridge 0.3.3' \
              --notes-file docs/GITHUB-RELEASE-0.3.3.md \
              --latest
          fi
